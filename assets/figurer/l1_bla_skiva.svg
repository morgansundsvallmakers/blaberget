<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="270mm" height="530mm" viewBox="0 0 27 53" role="img" aria-label="L 1, bla, bakgrundsskiva">
<title>L 1 – bla – skiva</title>
<desc>Stående L1, 19 × 45 cm, omritad efter horisontell referens. Sex hörn, parallella inre konturlinjer och en geometriskt cirkulär ring nära den breda änden. Ej officiellt original.</desc>
<rect width="27" height="53" rx=".18" fill="#eee9df" stroke="#d6d0c5" stroke-width=".14"/>
<g transform="translate(4 4)">
