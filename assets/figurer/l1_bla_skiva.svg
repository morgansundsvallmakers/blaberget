        fill="none" stroke="#e3ddd2" stroke-width=".13" opacity=".9"/>
  <path d="M 2.8 8.45 L 13 2.85 L 37.8 8.3 L 37.8 10.9 L 13 16.1 L 2.8 11.65 Z"
        fill="none" stroke="#e3ddd2" stroke-width=".11" opacity=".95"/>
  <circle cx="13" cy="9.5" r="3.0" fill="none" stroke="#e3ddd2" stroke-width=".13"/>
</g>
</g>
</svg>
