<svg xmlns="http://www.w3.org/2000/svg" width="968" height="560" viewBox="35 19 242 140" role="img" aria-label="Ballongmål med tre ballonger">
<title>Ballongmål – tre figurer tillsammans</title>
<desc>Uppdaterad kurvmodell: mjuka ytterkonturer och separata små knutar, spårade från användarens produktbild. De tre inre ringarna följer referensbildens oregelbundna rundade konturer. En målkomposition med tre ballonger, inte tre mål. Verkliga mått saknas, därför endast bildrelativ skala.</desc>
